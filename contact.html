<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Maarten van der Leeuw</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .contact-container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 5vw;
            font-weight: 200;
            margin-bottom: 2rem;
        }
        p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 3rem;
        }
        .email-link {
            font-size: 2rem;
            font-weight: 600;
            color: #000;
            text-decoration: underline;
            text-underline-offset: 10px;
        }
        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            text-decoration: none;
            color: #ccc;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: #000;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">Back to Home</a>
    <div class="contact-container">
        <h1>LET'S TALK.</h1>
        <p>I am always looking for new challenges and high-quality projects to collaborate on.</p>
        <a href="mailto:maarten@example.com" class="email-link">maarten@example.com</a>
    </div>
</body>
</html>
